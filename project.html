<!DOCTYPE html>
<html lang="en" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — George Kopf V</title>
    <meta name="description" content="Project detail — George Kopf V" />
    <meta name="theme-color" content="#f7f4ee" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/theme.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: 'oklch(var(--background) / <alpha-value>)',
              foreground: 'oklch(var(--foreground) / <alpha-value>)',
              card: 'oklch(var(--card) / <alpha-value>)',
              'card-foreground': 'oklch(var(--card-foreground) / <alpha-value>)',
              primary: 'oklch(var(--primary) / <alpha-value>)',
              'primary-foreground': 'oklch(var(--primary-foreground) / <alpha-value>)',
              secondary: 'oklch(var(--secondary) / <alpha-value>)',
              'secondary-foreground': 'oklch(var(--secondary-foreground) / <alpha-value>)',
              muted: 'oklch(var(--muted) / <alpha-value>)',
              'muted-foreground': 'oklch(var(--muted-foreground) / <alpha-value>)',
              accent: 'oklch(var(--accent) / <alpha-value>)',
              'accent-foreground': 'oklch(var(--accent-foreground) / <alpha-value>)',
              border: 'oklch(var(--border) / <alpha-value>)',
              input: 'oklch(var(--input) / <alpha-value>)',
              ring: 'oklch(var(--ring) / <alpha-value>)',
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            borderRadius: {
              sm: '0.225rem',
              md: '0.3rem',
              lg: '0.375rem',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen font-sans antialiased">
    <main id="project-root" class="mx-auto max-w-4xl px-6 py-12 md:py-16"></main>

    <script src="assets/data.js"></script>
    <script src="assets/shared.js"></script>
    <script src="assets/project.js"></script>
  </body>
</html>
